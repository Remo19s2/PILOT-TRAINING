services:
  - type: web
    name: prism-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SNS_BASE_URL
        sync: false
      - key: SNS_API_KEY
        sync: false
      - key: SNS_EXECUTION_URL_TEMPLATE
        sync: false
      - key: SNS_MASTER_WORKFLOW_ID
        sync: false
      - key: SNS_DECISION_WORKFLOW_ID
        sync: false
      - key: SNS_NEGOTIATION_WORKFLOW_ID
        sync: false
      - key: SNS_RISK_WORKFLOW_ID
        sync: false
      - key: SNS_CALLBACK_URL
        sync: false
      - key: SNS_WEBHOOK_SECRET
        sync: false
      - key: SNS_WEBHOOK_SIGNATURE_HEADER
        value: X-SNS-Webhook-Secret
      - key: SNS_WEBHOOK_AUTH_MODE
        value: shared_secret